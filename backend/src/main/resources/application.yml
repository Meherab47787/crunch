server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: crustcrunch-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/crustcrunch}
    username: ${DB_USERNAME:crustcrunch}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      # Hosted Postgres proxies drop idle connections; ping and recycle them before that happens
      keepalive-time: ${DB_KEEPALIVE_MS:60000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:120000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:600000}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 64
        jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

app:
  jwt:
    # Required. Generate with: openssl rand -base64 48
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  pricing:
    tax-rate: ${TAX_RATE:0.08}
    delivery-fee: ${DELIVERY_FEE:2.99}
    free-delivery-threshold: ${FREE_DELIVERY_THRESHOLD:35.00}
    min-delivery-order: ${MIN_DELIVERY_ORDER:10.00}
    currency: ${CURRENCY:USD}
  payments:
    simulated: ${PAYMENTS_SIMULATED:true}
  restaurant:
    name: Crust & Crunch
    tagline: Stone-baked pizza, smashed burgers & crispy chicken
    phone: ${RESTAURANT_PHONE:+1 (555) 014-2277}
    email: ${RESTAURANT_EMAIL:hello@crustandcrunch.example}
    address: ${RESTAURANT_ADDRESS:221 Ember Street, Springfield}
    timezone: ${RESTAURANT_TIMEZONE:UTC}
    delivery-minutes: ${DELIVERY_MINUTES:35}
    pickup-minutes: ${PICKUP_MINUTES:15}
    hours:
      - { days: "Mon – Thu", open: "11:00", close: "23:00" }
      - { days: "Fri – Sat", open: "11:00", close: "01:00" }
      - { days: "Sunday",    open: "12:00", close: "22:00" }
  bootstrap:
    admin-email: ${ADMIN_EMAIL:}
    admin-password: ${ADMIN_PASSWORD:}
    admin-name: ${ADMIN_NAME:Restaurant Admin}
    kitchen-email: ${KITCHEN_EMAIL:}
    kitchen-password: ${KITCHEN_PASSWORD:}
    demo-data: ${DEMO_DATA:false}
  uploads:
    dir: ${UPLOADS_DIR:./uploads}
    public-path: /uploads
