<div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
  <div class="min-w-0">
    @if (eyebrow()) {
      <p class="text-xs font-semibold uppercase tracking-widest text-charcoal-400">{{ eyebrow() }}</p>
    }
    <h1 class="truncate text-2xl font-extrabold text-charcoal-900 sm:text-3xl">{{ title() }}</h1>
    @if (subtitle()) {
      <p class="mt-1 text-sm text-charcoal-500">{{ subtitle() }}</p>
    }
  </div>
  <div class="flex flex-wrap items-center gap-2"><ng-content /></div>
</div>
