<ul class="space-y-3" [attr.aria-label]="ariaLabel()" role="list">
  @for (r of rows(); track r.key) {
    <li class="group">
      <div class="mb-1 flex items-baseline justify-between gap-3 text-sm">
        <span class="min-w-0 truncate font-medium text-charcoal-700" [title]="r.label">{{ r.label }}</span>
        <span class="shrink-0 tabular-nums">
          <b class="text-charcoal-900">{{ r.display }}</b>
          @if (r.secondary) { <span class="ml-1 text-xs text-charcoal-400">{{ r.secondary }}</span> }
        </span>
      </div>
      <div class="h-2.5 w-full rounded-full bg-charcoal-800/[0.05]" aria-hidden="true">
        <div class="h-full rounded-full bg-tomato-500 transition-[width] duration-500 group-hover:bg-tomato-600"
             [style.width.%]="r.pct" [style.min-width.px]="r.value > 0 ? 4 : 0"></div>
      </div>
    </li>
  }
</ul>
