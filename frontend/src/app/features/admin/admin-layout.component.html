<a href="#admin-main" class="sr-only focus:not-sr-only focus:fixed focus:left-4 focus:top-4 focus:z-[200] focus:rounded-lg focus:bg-white focus:px-4 focus:py-2">Skip to content</a>

<div class="min-h-screen bg-[#f6f5f3] lg:grid lg:grid-cols-[16rem_1fr]">
  <!-- desktop sidebar -->
  <aside class="no-print sticky top-0 hidden h-screen flex-col border-r border-charcoal-800/10 bg-white lg:flex" aria-label="Admin">
    <div class="flex h-20 items-center px-5">
      <a routerLink="/admin" aria-label="Admin dashboard"><app-logo [tagline]="false" /></a>
    </div>
    <p class="px-5 pb-2 text-[11px] font-semibold uppercase tracking-widest text-charcoal-400">Back office</p>
    <nav class="flex-1 space-y-0.5 overflow-y-auto px-3" aria-label="Admin sections">
      @for (l of links; track l.path) {
        <a [routerLink]="l.path" routerLinkActive="!bg-tomato-50 !text-tomato-700 [&_lucide-icon]:!text-tomato-500"
           [routerLinkActiveOptions]="{ exact: !!l.exact }" ariaCurrentWhenActive="page"
           class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm font-semibold text-charcoal-600 transition hover:bg-charcoal-800/5 hover:text-charcoal-900">
          <lucide-icon [name]="l.icon" [size]="18" class="text-charcoal-400" /> {{ l.label }}
        </a>
      }
    </nav>
    <div class="space-y-0.5 border-t border-charcoal-800/10 p-3">
      <a routerLink="/" class="flex items-center gap-3 rounded-xl px-3 py-2 text-sm font-medium text-charcoal-600 hover:bg-charcoal-800/5">
        <lucide-icon name="store" [size]="17" class="text-charcoal-400" /> View storefront
      </a>
      <a routerLink="/kitchen" class="flex items-center gap-3 rounded-xl px-3 py-2 text-sm font-medium text-charcoal-600 hover:bg-charcoal-800/5">
        <lucide-icon name="chef-hat" [size]="17" class="text-charcoal-400" /> Kitchen display
      </a>
      <div class="mt-2 flex items-center gap-3 rounded-xl bg-charcoal-800/[0.04] px-3 py-2.5">
        <span class="grid h-8 w-8 shrink-0 place-items-center rounded-full bg-ember-100 font-display text-sm font-bold text-ember-700">{{ initial() }}</span>
        <span class="min-w-0 flex-1 text-xs">
          <b class="block truncate text-sm text-charcoal-800">{{ auth.user()?.fullName }}</b>
          <span class="block truncate text-charcoal-400">{{ auth.user()?.email }}</span>
        </span>
        <button type="button" class="btn-ghost rounded-full p-2" (click)="auth.logout()" aria-label="Sign out" title="Sign out">
          <lucide-icon name="log-out" [size]="16" />
        </button>
      </div>
    </div>
  </aside>

  <!-- mobile top bar + drawer -->
  <header class="no-print sticky top-0 z-40 border-b border-charcoal-800/10 bg-white/95 backdrop-blur lg:hidden">
    <div class="flex h-16 items-center justify-between px-4">
      <a routerLink="/admin" aria-label="Admin dashboard"><app-logo [tagline]="false" /></a>
      <button type="button" class="btn-ghost rounded-full p-2.5" (click)="open.set(!open())"
              [attr.aria-expanded]="open()" aria-controls="admin-mobile-nav" aria-label="Admin menu">
        <lucide-icon [name]="open() ? 'x' : 'menu'" [size]="22" />
      </button>
    </div>
    @if (open()) {
      <nav id="admin-mobile-nav" class="max-h-[calc(100vh-4rem)] overflow-y-auto border-t border-charcoal-800/10 px-3 pb-4 pt-2 animate-fade-up" aria-label="Admin sections">
        @for (l of links; track l.path) {
          <a [routerLink]="l.path" routerLinkActive="!bg-tomato-50 !text-tomato-700" [routerLinkActiveOptions]="{ exact: !!l.exact }" ariaCurrentWhenActive="page"
             class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-semibold text-charcoal-700 hover:bg-charcoal-800/5">
            <lucide-icon [name]="l.icon" [size]="18" class="text-charcoal-400" /> {{ l.label }}
          </a>
        }
        <div class="my-2 h-px bg-charcoal-800/10"></div>
        <a routerLink="/" class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium hover:bg-charcoal-800/5"><lucide-icon name="store" [size]="17" /> View storefront</a>
        <a routerLink="/kitchen" class="flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium hover:bg-charcoal-800/5"><lucide-icon name="chef-hat" [size]="17" /> Kitchen display</a>
        <button type="button" class="flex w-full items-center gap-3 rounded-xl px-3 py-3 text-left text-sm font-semibold text-tomato-600 hover:bg-tomato-50" (click)="auth.logout()">
          <lucide-icon name="log-out" [size]="17" /> Sign out ({{ auth.user()?.email }})
        </button>
      </nav>
    }
  </header>

  <main id="admin-main" class="min-w-0 px-4 py-6 sm:px-6 lg:px-10 lg:py-8" tabindex="-1">
    <router-outlet />
  </main>
</div>
