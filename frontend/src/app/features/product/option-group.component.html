@let g = group();
<fieldset class="card p-5" [class.ring-2]="invalid()" [class.ring-tomato-300]="invalid()" [attr.aria-describedby]="'hint-' + g.id">
  <legend class="sr-only">{{ g.name }}</legend>
  <div class="mb-3 flex items-start justify-between gap-3">
    <div>
      <h2 class="text-lg font-bold">{{ g.name }}</h2>
      <p [id]="'hint-' + g.id" class="text-xs text-charcoal-500">{{ hint() }}</p>
    </div>
    @if (g.required) {
      <span class="chip shrink-0" [class]="invalid() ? 'bg-tomato-500 text-white' : 'bg-charcoal-800 text-cream-100'">Required</span>
    } @else {
      <span class="chip shrink-0 bg-charcoal-800/5 text-charcoal-500">Optional</span>
    }
  </div>
  <div class="grid gap-2 sm:grid-cols-2">
    @for (o of g.options; track o.id) {
      @let on = selected().includes(o.id);
      @let blocked = !o.available || (!on && g.selectionType === 'MULTIPLE' && atMax());
      <label class="flex cursor-pointer items-center gap-3 rounded-2xl border-2 px-3.5 py-3 transition has-[:focus-visible]:ring-4 has-[:focus-visible]:ring-ember-200"
             [class]="on ? 'border-tomato-500 bg-tomato-50' : 'border-charcoal-800/10 hover:border-charcoal-800/30'"
             [class.opacity-40]="blocked" [class.cursor-not-allowed]="blocked">
        <input [type]="g.selectionType === 'SINGLE' ? 'radio' : 'checkbox'" class="sr-only" [name]="'group-' + g.id"
               [checked]="on" [disabled]="blocked" (click)="onClick($event, o.id)" />
        <span class="grid h-5 w-5 shrink-0 place-items-center border-2 transition"
              [class.rounded-full]="g.selectionType === 'SINGLE'" [class.rounded-md]="g.selectionType === 'MULTIPLE'"
              [class]="on ? 'border-tomato-500 bg-tomato-500 text-white' : 'border-charcoal-800/25'">
          @if (on) { <lucide-icon name="check" [size]="12" [strokeWidth]="3" /> }
        </span>
        <span class="flex-1 text-sm font-semibold">{{ o.name }}</span>
        <span class="text-xs font-semibold text-charcoal-500">
          {{ !o.available ? 'Unavailable' : o.priceDelta > 0 ? (o.priceDelta | money: true) : '' }}
        </span>
      </label>
    }
  </div>
</fieldset>
