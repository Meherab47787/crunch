@if (svc.current(); as c) {
  <app-modal [title]="c.title" (closed)="svc.settle(false)">
    <p class="text-sm text-charcoal-600">{{ c.message }}</p>
    <div class="mt-6 flex justify-end gap-2">
      <button type="button" class="btn-outline" (click)="svc.settle(false)">Cancel</button>
      <button type="button" [class]="c.danger ? 'btn bg-tomato-600 text-white hover:bg-tomato-700' : 'btn-dark'" (click)="svc.settle(true)">
        {{ c.confirmLabel }}
      </button>
    </div>
  </app-modal>
}
