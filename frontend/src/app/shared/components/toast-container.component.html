<div class="pointer-events-none fixed inset-x-0 bottom-4 z-[100] flex flex-col items-center gap-2 px-4 sm:bottom-6 sm:items-end sm:pr-6 no-print"
     aria-live="polite" role="status">
  @for (t of toasts.toasts(); track t.id) {
    <div class="pointer-events-auto flex w-full max-w-sm items-center gap-3 rounded-2xl px-4 py-3 text-sm font-medium shadow-lift animate-fade-up"
         [class.bg-charcoal-800]="t.kind !== 'error'" [class.text-cream-100]="t.kind !== 'error'"
         [class.bg-tomato-600]="t.kind === 'error'" [class.text-white]="t.kind === 'error'">
      <lucide-icon [name]="t.kind === 'success' ? 'circle-check' : t.kind === 'error' ? 'circle-alert' : 'info'" [size]="18"
                   [class.text-ember-300]="t.kind === 'success'" />
      <span class="flex-1">{{ t.message }}</span>
      @if (t.action) {
        <button type="button" class="font-bold text-ember-300 hover:underline" (click)="t.action.run(); toasts.dismiss(t.id)">{{ t.action.label }}</button>
      }
      <button type="button" class="opacity-60 hover:opacity-100" (click)="toasts.dismiss(t.id)" aria-label="Dismiss">
        <lucide-icon name="x" [size]="16" />
      </button>
    </div>
  }
</div>
