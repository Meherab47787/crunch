<div class="fixed inset-0 z-[90] flex items-end justify-center bg-charcoal-900/50 p-0 backdrop-blur-sm sm:items-center sm:p-6"
     (click)="onBackdrop($event)">
  <div class="flex max-h-[92vh] w-full flex-col overflow-hidden rounded-t-3xl bg-white shadow-2xl animate-fade-up sm:rounded-3xl"
       [class.sm:max-w-lg]="size() === 'md'" [class.sm:max-w-3xl]="size() === 'lg'" [class.sm:max-w-5xl]="size() === 'xl'"
       role="dialog" aria-modal="true" [attr.aria-label]="title()" tabindex="-1" #panel>
    <header class="flex items-center justify-between gap-4 border-b border-charcoal-800/10 px-5 py-4 sm:px-6">
      <h2 class="text-lg font-bold">{{ title() }}</h2>
      <button type="button" class="btn-ghost -mr-2 rounded-full p-2" (click)="closed.emit()" aria-label="Close">
        <lucide-icon name="x" [size]="18" />
      </button>
    </header>
    <div class="overflow-y-auto px-5 py-5 sm:px-6"><ng-content /></div>
    <ng-content select="[modal-footer]" />
  </div>
</div>
